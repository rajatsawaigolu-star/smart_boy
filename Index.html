<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Cute Boy - Official Video</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#fff;text-align:center}
.banner{width:100%;height:230px;background:linear-gradient(45deg,#ff0080,#7928ca);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900}
.card{max-width:430px;margin:-60px auto 20px;background:#fff;color:#000;border-radius:22px;padding:20px}
.thumb{width:100%;border-radius:14px}
.title{font-size:21px;font-weight:800;margin:14px 0 6px}
.btn{width:100%;padding:15px;background:#ff0080;color:#fff;border:0;border-radius:12px;font-size:18px;font-weight:800}
video{width:100%;border-radius:12px;display:none;margin-top:12px}
</style>
</head>
<body>
<div class="banner">SMART CUTE BOY</div>
<div class="card">
<img id="thumb" class="thumb" src="https://via.placeholder.com/400x220?text=Smart+Cute+Boy">
<div id="title" class="title">Please watch my Full Video</div>
<button id="payBtn" class="btn" onclick="pay()">🔓 Pay ₹20 to Unlock Full Video</button>
<video id="video" controls></video>
</div>
<script>
function load(){
 let th=localStorage.getItem('scb_thumb');
 let v=localStorage.getItem('scb_video');
 let t=localStorage.getItem('scb_title');
 if(t) document.getElementById('title').innerText=t;
 if(th) document.getElementById('thumb').src=th;
 if(v) document.getElementById('video').src=v;
}
function pay(){
 let v=document.getElementById('video').src;
 if(!v.includes('http')){alert('Admin lo video save chey bro!');return;}
 if(confirm('Pay ₹20 to unlock? OK nokithe video play avutundi (Demo)')){
  document.getElementById('video').style.display='block';
  document.getElementById('payBtn').innerText='✅ Unlocked';
  document.getElementById('video').play();
 }
}
load();
</script>
</body>
                             </html>
